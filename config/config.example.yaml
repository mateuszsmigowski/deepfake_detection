experiment:
  name: "baseline-example"
  mode: "baseline"
  real_domain: "Original"
  fake_domains:
    - "Deepfakes"
    - "Face2Face"
    - "FaceSwap"
    - "NeuralTextures"
    - "FaceShifter"
  held_out_domain: "NeuralTextures"

data:
  dataset_path: "/Volumes/DyskSSD1T/Datasets/FaceForensics++ Extracted Dataset (C23)/FF++C32-Frames"
  train_real: 1000
  train_fake: 1000
  val_real: 500
  val_fake: 500

runtime:
  seed: 42
  device: "auto"
  deterministic: true
  num_workers: 4

model:
  architecture: "resnet18"
  pretrained: true
  freeze_backbone: false

manifest:
  path: "../manifests/manifest.csv"

split:
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  path: "../manifests/splits/"

training:
  epochs: 10
  batch_size: 16
  learning_rate: 0.0002
  validation_interval: 1

domain_adaptation:
  gradient_reversal_lambda: 1.0
  domain_loss_weight: 1.0

outputs:
  runs_path: "runs"
  save_checkpoints: true
  save_metrics: true
  checkpoint_metric: "validation_balanced_accuracy"
