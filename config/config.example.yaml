experiment:
  name: "testing"
  mode: "dann"
  protocol: "adaptation" # "generalization" 
  real_domain: "Original"
  fake_domains:
    - "Deepfakes"
    - "Face2Face"
    - "FaceSwap"
    - "NeuralTextures"
    - "FaceShifter"
  held_out_domain: "NeuralTextures"

data:
  dataset_path: "/Volumes/DyskSSD1T/Datasets/FaceForensics++ Extracted Dataset (C23)/FF++C32-Frames_cropped"
  train_source_real: 1000
  train_source_fake: 3000
  val_source_real: 1000
  val_source_fake: 3000
  train_target_fake: 3000

runtime:
  seed: 132
  device: "auto"
  deterministic: true
  num_workers: 4

model:
  architecture: "mobilenet_v3_small"
  pretrained: true
  freeze_backbone: false

manifest:
  path: "../manifests/manifest.csv"

split:
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
  seed: 156
  path: "../manifests/splits/"

training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.0001
  validation_interval: 1
  early_stopping_patience: null
  pos_weight: true

domain_adaptation:
  gradient_reversal_lambda: 1.0
  domain_loss_weight: 0.5
  grl_scheduler_enable: true
  grl_scheduler_gamma: 10.0

outputs:
  runs_path: "runs"
  save_checkpoints: true
  save_metrics: true
  checkpoint_metric: "validation_balanced_accuracy"
